[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxlink"
version = "0.1.0"
description = "Offline-first toolkit for connecting speech encoders and discrete speech units to language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Huang Yu" }]
keywords = ["speech", "llm", "discrete-units", "asr", "spoken-language-understanding"]

[project.optional-dependencies]
numpy = ["numpy>=1.21"]
torch = ["torch>=1.13"]

[project.scripts]
voxlink = "voxlink.cli:main"

[project.urls]
Homepage = "https://github.com/livemyu/voxlink"
Issues = "https://github.com/livemyu/voxlink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voxlink"]

# 纯 Python 内核不带任何数据文件；py.typed 随包分发以启用类型检查。
[tool.hatch.build.targets.wheel.force-include]
"src/voxlink/py.typed" = "voxlink/py.typed"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", # 允许在中文注释/文档中使用全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["voxlink"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: 需要可选后端或较慢的测试",
]

[tool.coverage.run]
branch = true
source = ["voxlink"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
